server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Floor-plan uploads travel as base64 JSON (larger than raw file).
  client_max_body_size 25m;

  # All backend calls are namespaced under /api (trailing slash strips the prefix,
  # so /api/layouts -> http://api:3000/layouts).
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    proxy_set_header Authorization $http_authorization;
  }

  location /product-images/ {
    proxy_pass http://api:3000/product-images/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /floor-plans/ {
    proxy_pass http://api:3000/floor-plans/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # SPA routes (/layouts, /products, /analytics, /admin, …) must fall through to
  # index.html so a hard refresh loads the app instead of hitting the API (401).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
