# Local baseline — customize services per project (ADR-0003)
services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      MONGODB_URI: mongodb://mongo:27017/app
    depends_on:
      - mongo
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  # Uncomment when the Python capability service is real work:
  # python:
  #   build: ./services/python
  #   ports:
  #     - "8001:8001"

volumes:
  mongo_data:
